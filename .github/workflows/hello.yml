name: Hello Actions

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ver archivos
        run: ls -la

      - name: Ver sistema operativo
        run: uname -a

      - name: Ver versión de Python
        run: python --version

      - name: Ver versión de Git
        run: git --version